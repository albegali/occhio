<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HDMI Vision — Output</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0b0b0d; color: #f0f0f2; font-family: -apple-system, system-ui, sans-serif; }
  #bar {
    position: sticky; top: 0; z-index: 1;
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px; background: #17171a; border-bottom: 1px solid #2a2a2e;
    font-size: 16px;
  }
  #live { padding: 4px 10px; border-radius: 4px; font-weight: 600; font-size: 14px; }
  #live.on { background: #1e4b26; color: #9be0a6; }
  #live.off { background: #4b1e1e; color: #e09b9b; }
  #ts { color: #9a9aa0; }
  #empty { color: #6a6a70; font-style: italic; font-size: 2rem; padding: 20px 40px; }
  table { width: 100%; border-collapse: collapse; }
  td { width: 50%; vertical-align: top; padding: 20px 28px; border-bottom: 1px solid #2a2a2e; font-size: 2rem; line-height: 1.4; white-space: pre-wrap; word-wrap: break-word; }
  td + td { border-left: 1px solid #2a2a2e; }
  tr.error td { color: #e09b9b; }
</style>
</head>
<body>
  <div id="bar">
    <span id="live" class="off">disconnesso</span>
    <span id="ts"></span>
  </div>
  <div id="empty">In attesa della prima analisi…</div>
  <table><tbody id="tbody"></tbody></table>

  <script>
    const liveEl = document.getElementById("live");
    const tsEl = document.getElementById("ts");
    const tbody = document.getElementById("tbody");
    const seen = new Set();

    // Una riga per domanda, sempre ordinate per chiave ("2" prima di "10")
    const rows = new Map(); // key -> <tr>
    const compareKeys = (a, b) => {
      const na = /^\d/.test(a), nb = /^\d/.test(b);
      if (na !== nb) return na ? -1 : 1; // chiavi non numeriche in coda
      return a.localeCompare(b, "it", { numeric: true });
    };
    const short = (s, n = 80) => (s.length > n ? s.slice(0, n).trimEnd() + "…" : s);

    function makeRow() {
      document.getElementById("empty")?.remove();
      const tr = document.createElement("tr");
      tr.append(document.createElement("td"), document.createElement("td"));
      return tr;
    }

    function touch(ts) {
      tsEl.textContent = "Ultimo aggiornamento: " + new Date(ts || Date.now()).toLocaleTimeString("it-IT");
    }

    function showBlock(b) {
      let tr = rows.get(b.key);
      if (!tr) {
        tr = makeRow();
        tr.dataset.key = b.key;
        rows.set(b.key, tr);
        const next = [...tbody.querySelectorAll("tr[data-key]")].find((r) => compareKeys(b.key, r.dataset.key) < 0);
        tbody.insertBefore(tr, next || tbody.querySelector("tr:not([data-key])"));
      }
      const [c1, c2] = tr.children;
      c1.textContent = `Domanda ${b.key} (${short(b.question)})`;
      c1.title = b.question;
      c2.textContent = b.error ? "Errore: " + b.error : b.answer ?? "…";
      tr.className = b.error ? "error" : "";
      if (b.answer || b.error) touch();
    }

    function showResult(r) {
      // alla riconnessione il server rimanda gli errori: scarta i duplicati
      if (!r || !r.error || seen.has(r.id)) return;
      seen.add(r.id);
      const tr = makeRow();
      tr.className = "error";
      tr.children[0].textContent = "Errore " + new Date(r.ts).toLocaleTimeString("it-IT");
      tr.children[1].textContent = r.error;
      tbody.append(tr);
      touch(r.ts);
    }

    function setLive(on) {
      liveEl.textContent = on ? "live" : "disconnesso";
      liveEl.className = on ? "on" : "off";
    }

    // all'apertura il server invia le domande della sessione, poi gli aggiornamenti
    const es = new EventSource("/api/events");
    es.onopen = () => setLive(true);
    es.onerror = () => setLive(false); // EventSource riprova la connessione automaticamente
    es.addEventListener("block", (ev) => showBlock(JSON.parse(ev.data)));
    es.addEventListener("result", (ev) => showResult(JSON.parse(ev.data)));
  </script>
</body>
</html>
