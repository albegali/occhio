<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HDMI Vision</title>
<link rel="stylesheet" href="/katex/katex.min.css">
<script src="/katex/katex.min.js"></script>
<script src="/katex/contrib/auto-render.min.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow-x: hidden; background: #0b0b0d; color: #e8e8ea; font-family: -apple-system, system-ui, sans-serif; }
  #app { display: flex; height: 100%; gap: 16px; padding: 16px; }
  #side { width: 260px; flex: none; display: flex; flex-direction: column; gap: 10px; }
  #preview { width: 100%; aspect-ratio: 16 / 9; background: #000; border: 2px solid #3a3a3f; border-radius: 8px; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: contain; display: block; }
  select, .hbtn {
    width: 100%; background: #232327; color: #e8e8ea; border: 2px solid #3a3a3f; border-radius: 8px;
    padding: 12px 10px; font-size: 15px; text-align: center;
  }
  .hbtn { position: relative; overflow: hidden; cursor: pointer; user-select: none; }
  .hbtn span { position: relative; z-index: 1; }
  .hbtn i { position: absolute; inset: 0 auto 0 0; width: 0; background: #2f6f3e; }
  .hbtn.arming i { width: 100%; transition: width 3s linear; }
  .hbtn.fired { border-color: #3f8f4f; }
  #status { padding: 4px 8px; border-radius: 4px; font-size: 13px; text-align: center; }
  #status.ok { background: #1e4b26; color: #9be0a6; }
  #status.progress { background: #4b3d1e; color: #e0c99b; }
  #status.error { background: #4b1e1e; color: #e09b9b; }
  #status.idle { background: #2a2a2e; color: #9a9aa0; }
  #tokens { font-size: 13px; color: #9a9aa0; text-align: center; }
  #main { flex: 1; min-width: 0; overflow-y: auto; border: 1px solid #2a2a2e; border-radius: 12px; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  td { vertical-align: top; padding: 18px 22px; border-bottom: 1px solid #2a2a2e; font-size: 1.6rem; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; }
  td:first-child { width: 22%; }
  td + td { border-left: 1px solid #2a2a2e; }
  tr.error td { color: #e09b9b; }
  #empty { color: #6a6a70; font-style: italic; font-size: 1.4rem; padding: 22px; }
  #live { font-size: 12px; color: #9a9aa0; text-align: center; }
  .katex-display { margin: 0.4em 0; overflow-x: auto; overflow-y: hidden; }
</style>
</head>
<body>
  <div id="app">
    <div id="side">
      <div id="preview"><video id="video" autoplay playsinline muted></video></div>
      <div class="hbtn" id="analyzeBtn" title="Tieni il mouse sopra per 3 secondi"><i></i><span>Avvia analisi</span></div>
      <select id="deviceSelect"></select>
      <div class="hbtn" id="reloadBtn" title="Se l'immagine si blocca o diventa un colore pieno dopo un cambio di risoluzione della sorgente, riacquisisce lo stream"><i></i><span>Riavvia stream</span></div>
      <div id="status" class="idle">inattivo</div>
      <div id="tokens"></div>
      <div id="live">disconnesso</div>
    </div>
    <div id="main">
      <div id="empty">In attesa della prima analisi…</div>
      <table id="table"><tbody></tbody></table>
    </div>
  </div>
  <canvas id="canvas" hidden></canvas>

  <script>
    const HOVER_MS = 3000;
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const deviceSelect = document.getElementById("deviceSelect");
    const statusEl = document.getElementById("status");
    const tokensEl = document.getElementById("tokens");
    const liveEl = document.getElementById("live");
    const mainEl = document.getElementById("main");
    const tbody = document.querySelector("#table tbody");

    let clientConfig = { imageMaxWidth: 1280, jpegQuality: 0.7 };
    let inFlight = false;
    const seen = new Set();

    function setStatus(kind, text) {
      statusEl.className = kind;
      statusEl.textContent = text;
    }

    // Pulsante che scatta solo dopo HOVER_MS di hover continuo; per ripetere bisogna uscire e rientrare
    function hoverButton(el, action) {
      let timer = null;
      el.addEventListener("mouseenter", () => {
        if (el.classList.contains("fired")) return;
        el.classList.add("arming");
        timer = setTimeout(() => {
          el.classList.remove("arming");
          el.classList.add("fired");
          action();
        }, HOVER_MS);
      });
      el.addEventListener("mouseleave", () => {
        clearTimeout(timer);
        el.classList.remove("arming", "fired");
      });
    }

    async function loadClientConfig() {
      try {
        clientConfig = await (await fetch("/api/client-config")).json();
      } catch (e) {
        console.error("Impossibile caricare la config client", e);
      }
    }

    // --- Output: una riga per domanda, sempre ordinate per chiave ("2" prima di "10") ---
    const rows = new Map(); // key -> <tr>
    const compareKeys = (a, b) => {
      const na = /^\d/.test(a), nb = /^\d/.test(b);
      if (na !== nb) return na ? -1 : 1; // chiavi non numeriche in coda
      return a.localeCompare(b, "it", { numeric: true });
    };
    const MATH = { delimiters: [{ left: "$$", right: "$$", display: true }, { left: "$", right: "$", display: false }, { left: "\\[", right: "\\]", display: true }, { left: "\\(", right: "\\)", display: false }], throwOnError: false };
    // Testo + formule LaTeX renderizzate con KaTeX (se caricato)
    function setMath(el, text) {
      el.textContent = text.replace(/\*\*/g, ""); // eventuale grassetto Markdown sfuggito al prompt
      if (window.renderMathInElement) renderMathInElement(el, MATH);
    }
    const short = (s, n = 30) => (s.length > n ? s.slice(0, n).trimEnd() + "…" : s);

    function makeRow() {
      document.getElementById("empty")?.remove();
      const tr = document.createElement("tr");
      tr.append(document.createElement("td"), document.createElement("td"));
      return tr;
    }

    function showBlock(b) {
      let tr = rows.get(b.key);
      if (!tr) {
        tr = makeRow();
        tr.dataset.key = b.key;
        rows.set(b.key, tr);
        const next = [...tbody.querySelectorAll("tr[data-key]")].find((r) => compareKeys(b.key, r.dataset.key) < 0);
        tbody.insertBefore(tr, next || tbody.querySelector("tr:not([data-key])"));
      }
      const [c1, c2] = tr.children;
      c1.textContent = `Domanda ${b.key} (${short(b.question)})`;
      c1.title = b.question;
      if (b.error) c2.textContent = "Errore: " + b.error;
      else setMath(c2, b.answer ?? "…");
      tr.className = b.error ? "error" : "";
    }

    function showResult(r) {
      // alla riconnessione il server rimanda gli errori: scarta i duplicati
      if (!r || !r.error || seen.has(r.id)) return;
      seen.add(r.id);
      const tr = makeRow();
      tr.className = "error";
      tr.children[0].textContent = "Errore " + new Date(r.ts).toLocaleTimeString("it-IT");
      tr.children[1].textContent = r.error;
      tbody.append(tr);
      mainEl.scrollTo({ top: mainEl.scrollHeight, behavior: "smooth" });
    }

    function connectEvents() {
      const es = new EventSource("/api/events");
      es.onopen = () => { liveEl.textContent = "live"; };
      es.onerror = () => { liveEl.textContent = "disconnesso"; };
      es.addEventListener("block", (ev) => showBlock(JSON.parse(ev.data)));
      es.addEventListener("result", (ev) => showResult(JSON.parse(ev.data)));
      es.addEventListener("config", (ev) => { clientConfig = { ...clientConfig, ...JSON.parse(ev.data) }; });
    }

    // --- Dispositivi / stream ---
    async function populateDevices() {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const videoInputs = devices.filter((d) => d.kind === "videoinput");
      deviceSelect.innerHTML = "";
      for (const d of videoInputs) {
        const opt = document.createElement("option");
        opt.value = d.deviceId;
        opt.textContent = d.label || `Camera ${deviceSelect.length + 1}`;
        deviceSelect.appendChild(opt);
      }
      let saved = null;
      try { saved = localStorage.getItem("hdmiVision.deviceId"); } catch (e) {}
      if (saved && videoInputs.some((d) => d.deviceId === saved)) deviceSelect.value = saved;
    }

    async function startStream(deviceId) {
      if (video.srcObject) video.srcObject.getTracks().forEach((t) => t.stop());
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          deviceId: deviceId ? { exact: deviceId } : undefined,
          width: { ideal: 1920 },
          height: { ideal: 1080 },
        },
        audio: false,
      });
      video.srcObject = stream;
      // Dopo il primo getUserMedia le label dei device sono disponibili: ripopola.
      await populateDevices();
    }

    deviceSelect.addEventListener("change", async () => {
      try { localStorage.setItem("hdmiVision.deviceId", deviceSelect.value); } catch (e) {}
      try { await startStream(deviceSelect.value); } catch (e) { setStatus("error", "errore camera"); }
    });

    // Riacquisisce lo stream: utile se il segnale sorgente cambia risoluzione/refresh
    // e il browser resta agganciato al vecchio formato mostrando un frame bloccato.
    hoverButton(document.getElementById("reloadBtn"), async () => {
      try { await startStream(deviceSelect.value || undefined); } catch (e) { setStatus("error", "errore riavvio camera"); }
    });

    // --- Cattura e analisi ---
    function captureFrameBase64() {
      const vw = video.videoWidth, vh = video.videoHeight;
      if (!vw || !vh) return null;
      const scale = Math.min(1, clientConfig.imageMaxWidth / vw);
      canvas.width = Math.round(vw * scale);
      canvas.height = Math.round(vh * scale);
      canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL("image/jpeg", clientConfig.jpegQuality).split(",")[1];
    }

    async function analyze() {
      if (inFlight) return;
      const image = captureFrameBase64();
      if (!image) return setStatus("error", "nessun video da catturare");
      inFlight = true;
      setStatus("progress", "in corso");
      try {
        const res = await fetch("/api/frame", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image }),
        });
        if (res.status === 409) return setStatus("progress", "elaborazione già in corso");
        const data = await res.json();
        if (data.error) return setStatus("error", "errore: " + data.error);
        setStatus("ok", (data.duplicate ? "ok (nessuna domanda nuova o cambiata)" : "ok") + (data.fallback ? ` · fallback ${data.model}` : ""));
        if (data.usage) tokensEl.textContent = `token: in ${data.usage.input_tokens} / out ${data.usage.output_tokens}`;
      } catch (e) {
        setStatus("error", "errore di rete");
      } finally {
        inFlight = false;
      }
    }

    hoverButton(document.getElementById("analyzeBtn"), analyze);

    // --- Avvio ---
    (async function init() {
      await loadClientConfig();
      connectEvents();
      fetch("/api/reset", { method: "POST" }).catch(() => {}); // nuova sessione: dimentica i blocchi già visti
      try {
        let saved = null;
        try { saved = localStorage.getItem("hdmiVision.deviceId"); } catch (e) {}
        await startStream(saved || undefined);
      } catch (e) {
        setStatus("error", "accesso alla camera negato");
      }
    })();
  </script>
</body>
</html>
